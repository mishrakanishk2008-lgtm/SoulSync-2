<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SoulSync</title>
    <meta name="description" content="Warm, aesthetic private couple dashboard for love notes, polaroid snaps, milestone countdowns, and AI date planning." />
    <meta property="og:title" content="SoulSync" />
    <meta property="og:description" content="Warm, aesthetic private couple dashboard for love notes, polaroid snaps, milestone countdowns, and AI date planning." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('soulsync_theme');
          if (!saved) {
            var rawSettings = localStorage.getItem('soulsync_settings');
            if (rawSettings) {
              var parsed = JSON.parse(rawSettings);
              if (parsed && parsed.activeTheme) saved = parsed.activeTheme;
            }
          }
          var gradients = {
            'blush': 'linear-gradient(135deg, #fffaf5 0%, #fff1f2 50%, #fdf2f8 100%)',
            'mint-whisper': 'linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 45%, #f7fee7 100%)',
            'mint': 'linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 45%, #f7fee7 100%)',
            'lavender-dream': 'linear-gradient(135deg, #faf5ff 0%, #f3e8ff 50%, #fdf2f8 100%)',
            'lavender': 'linear-gradient(135deg, #faf5ff 0%, #f3e8ff 50%, #fdf2f8 100%)',
            'golden-hour': 'linear-gradient(135deg, #fffbeb 0%, #fef3c7 45%, #fff7ed 100%)',
            'sky-cotton': 'linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #f5f3ff 100%)',
            'cocoa-cream': 'linear-gradient(135deg, #fdfbf7 0%, #f7f3ed 50%, #fdf6ec 100%)',
            'berry-soft': 'linear-gradient(135deg, #fff1f2 0%, #fce7f3 50%, #fff5f7 100%)',
            'sage-garden': 'linear-gradient(135deg, #f4f7f4 0%, #e8f0e9 50%, #f9fbf9 100%)'
          };
          var t = saved || 'blush';
          var bg = gradients[t] || gradients['blush'];
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.setProperty('--theme-bg-gradient', bg);
          document.documentElement.style.background = bg;
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-amber-50/40 text-stone-800 antialiased selection:bg-rose-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
